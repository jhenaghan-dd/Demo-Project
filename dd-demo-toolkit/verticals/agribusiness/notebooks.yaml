notebooks:
  - name: "[Agribusiness] Data-Platform Cascade RCA — Stale CME Feed → FRM Mispricing"
    type: investigation
    time_range: "1h"
    cells:
      - type: notebook_cells
        attributes:
          definition:
            type: markdown
            text: |
              # Investigation: producers quoted on stale prices — root cause RCA

              **Symptom (reported, not alerted):** FRM specialists and producers in
              South America report **cash bids / quotes that look wrong** in Bunge
              Mobile, myBunge, and BungeAg. No infrastructure alert fired — servers,
              network, and SAP all look "green." This is the **silent, cross-cutting
              failure** class: the data is bad, but the infrastructure is fine.

              **Diagnostic gap today:** with 28 fragmented tools, the team would jump
              between an app tool, a network tool, a DB tool, and SAP Solution Manager
              and still not see it — because *nothing watches the data platform that
              feeds every app*. This notebook walks the RCA on one platform, and it
              matches what Watchdog + Bits AI surface automatically (last cell).
      - type: notebook_cells
        attributes:
          definition:
            type: markdown
            text: |
              ## Step 1 — Confirm the business symptom
              FRM is quoting on stale prices, and quote latency is climbing. This is
              what the desk and producers actually feel.
      - type: notebook_cells
        attributes:
          definition:
            type: timeseries
            title: "FRM stale-quote % by region (the business symptom)"
            show_legend: true
            requests:
              - response_format: timeseries
                display_type: line
                queries:
                  - {data_source: metrics, name: stale, query: "avg:agri.pricing.stale_quote_pct{environment:production} by {region}"}
                formulas:
                  - {formula: "stale", alias: "stale quote %"}
      - type: notebook_cells
        attributes:
          definition:
            type: timeseries
            title: "FRM quote latency by region (avg + max)"
            show_legend: true
            requests:
              - response_format: timeseries
                display_type: line
                queries:
                  - {data_source: metrics, name: avg, query: "avg:agri.pricing.quote_latency_ms{environment:production} by {region}"}
                  - {data_source: metrics, name: max, query: "max:agri.pricing.quote_latency_ms{environment:production} by {region}"}
                formulas:
                  - {formula: "avg", alias: "avg ms"}
                  - {formula: "max", alias: "max ms"}
      - type: notebook_cells
        attributes:
          definition:
            type: markdown
            text: |
              ## Step 2 — Rule out the usual suspects
              Before blaming the network (the reflex Shawn described), confirm what is
              **healthy**: site connectivity, the Oracle DB, and SAP are all normal —
              so this is **not** a network, database, or SAP problem.
      - type: notebook_cells
        attributes:
          definition:
            type: timeseries
            title: "Healthy: site connectivity % & Oracle query latency (rule out network + DB)"
            show_legend: true
            requests:
              - response_format: timeseries
                display_type: line
                queries:
                  - {data_source: metrics, name: conn, query: "avg:agri.site.connectivity_pct{environment:production}"}
                  - {data_source: metrics, name: db, query: "avg:agri.db.query_latency_ms{environment:production}"}
                formulas:
                  - {formula: "conn", alias: "site connectivity %"}
                  - {formula: "db", alias: "Oracle query ms"}
      - type: notebook_cells
        attributes:
          definition:
            type: timeseries
            title: "Healthy: SAP HANA memory % & ABAP response (rule out SAP)"
            show_legend: true
            requests:
              - response_format: timeseries
                display_type: line
                queries:
                  - {data_source: metrics, name: hana, query: "avg:agri.saphana.memory_used_pct{environment:production}"}
                  - {data_source: metrics, name: abap, query: "avg:agri.sapnw.abap_response_time_ms{environment:production}"}
                formulas:
                  - {formula: "hana", alias: "HANA mem %"}
                  - {formula: "abap", alias: "ABAP response ms"}
      - type: notebook_cells
        attributes:
          definition:
            type: markdown
            text: |
              ## Step 3 — Walk upstream: the GCP data platform (root cause)
              The FRM stale-quote rise tracks **one upstream signal**: the CME
              market-data feed is aging. The feed-age curve **leads** the stale-quote
              curve — that is the root cause, and nothing was alerting on it.
      - type: notebook_cells
        attributes:
          definition:
            type: timeseries
            title: "ROOT CAUSE — CME pricing-feed age (s) leads FRM stale-quote %"
            show_legend: true
            requests:
              - response_format: timeseries
                display_type: line
                queries:
                  - {data_source: metrics, name: feed, query: "avg:agri.dataplatform.pricing_feed_age_sec{environment:production}"}
                  - {data_source: metrics, name: stale, query: "avg:agri.pricing.stale_quote_pct{environment:production}"}
                formulas:
                  - {formula: "feed", alias: "CME feed age (s)"}
                  - {formula: "stale", alias: "FRM stale quote %"}
      - type: notebook_cells
        attributes:
          definition:
            type: timeseries
            title: "Data-platform pipeline freshness (s) & error rate"
            show_legend: true
            requests:
              - response_format: timeseries
                display_type: line
                queries:
                  - {data_source: metrics, name: fresh, query: "avg:agri.dataplatform.pipeline_freshness_sec{environment:production}"}
                  - {data_source: metrics, name: err, query: "avg:agri.dataplatform.pipeline_error_rate{environment:production}"}
                formulas:
                  - {formula: "fresh", alias: "pipeline freshness (s)"}
                  - {formula: "err", alias: "pipeline error rate"}
      - type: notebook_cells
        attributes:
          definition:
            type: markdown
            text: |
              ## Step 4 — Blast radius: one feed, every revenue app
              The Bunge Data Platform feeds **every** customer app. A single stale
              feed degrades Bunge Mobile cash bids, myBunge, FRM, and BungeAg
              **simultaneously** — visible in the APM dependency map (every app →
              `bunge-data-platform`). This is the cross-cutting risk no single-domain
              tool catches.
      - type: notebook_cells
        attributes:
          definition:
            type: timeseries
            title: "Revenue-app throughput by service (all depend on the feed)"
            show_legend: true
            requests:
              - response_format: timeseries
                display_type: line
                queries:
                  - {data_source: metrics, name: reqs, query: "sum:agri.app.requests_total{service_name:(bunge-mobile-bff OR mybunge-portal OR frm-pricing-platform OR bungeag-web)} by {service_name}"}
                formulas:
                  - {formula: "reqs", alias: "requests"}
      - type: notebook_cells
        attributes:
          definition:
            type: markdown
            text: |
              ## Step 5 — Remediation & recovery
              Refreshing/repairing the CME pricing pipeline recovers signals **in
              order**: feed age drops first, then FRM stale-quote % falls, then quote
              latency and error rate normalize. Watch the feed-age + stale-quote chart
              above settle back to baseline — recovery confirms causation.

              **Runbook:** restart the Dataflow/Composer pricing-feed job → verify
              `pricing_feed_age_sec` < 20s → confirm FRM stale-quote % < 1% → close.
      - type: notebook_cells
        attributes:
          definition:
            type: markdown
            text: |
              ## Business impact / ROI
              - **Direct margin risk:** during harvest, mispriced cash bids and FRM
                contracts erode the 1–2% pricing edge Mauger cited — on 10,000+
                transactions/day.
              - **It was silent:** no infra alert fired. The gap is exactly the
                data-platform layer no tool watches today.
              - **MTTR:** Watchdog flagged it with no threshold; this RCA is minutes,
                not the multi-hour, multi-tool bridge call it is today (Shawn's
                59-minute rule becomes achievable).
      - type: notebook_cells
        attributes:
          definition:
            type: markdown
            text: |
              ## How this matches Watchdog + Bits AI (the AIOps proof)
              You just walked this RCA by hand. **Watchdog** detected
              `agri.dataplatform.pricing_feed_age_sec` as an anomaly with **no
              threshold configured**, and correlated it with the FRM stale-quote rise —
              the same root → symptom chain (`data-platform-freshness`,
              `signal_chain: 1-root-cause → 3-symptom`). Ask **Bits AI** in plain
              language — *"why are FRM quotes stale right now?"* — and it returns the
              stale CME feed as the cause, **citing these signals**, and can enrich +
              open the ServiceNow incident automatically.

              **The point for the skeptical towers:** the AI is not a black box — this
              notebook is the human investigation that lands on the *same* answer.
      - type: notebook_cells
        attributes:
          definition:
            type: markdown
            text: |
              ## Follow-ups
              - Add a freshness SLO on the CME pricing feed (`pricing_feed_age_sec`).
              - Wire the Watchdog signal → Workflow → ServiceNow auto-incident.
              - Extend feed-quality monitoring to the SAP and Salesforce sources feeding
                the same platform (the data-science teams' "garbage in, garbage out").

  - name: "[Agribusiness] AIOps Auto-Remediation — ServiceNow Close-Loop"
    type: runbook
    time_range: "1h"
    cells:
      - type: notebook_cells
        attributes:
          definition:
            type: markdown
            text: |
              # AIOps close-loop: enrich → auto-open → auto-close (ServiceNow)

              This is Eduardo's #1 ask made concrete: *"analyze the ticket, enrich
              it, open the incident when necessary, close it when necessary…
              analysts see only real tickets."* It walks the same data-platform
              cascade as the RCA notebook, but from the **automation** angle —
              what Datadog does *for* the analyst, not what the analyst does by hand.

              > **Simulated close-loop.** This environment has no live ServiceNow
              > integration, so the `agri.itsm.*` signals below are driven by the
              > cascade plugin in lockstep with the incident (auto-open when the
              > customer-facing symptom appears, auto-close on recovery). The
              > `workflows.yaml` in this vertical is the real wiring — bind a
              > ServiceNow connection and it executes against your tenant.
      - type: notebook_cells
        attributes:
          definition:
            type: markdown
            text: |
              ## Step 1 — Watchdog detects (no threshold set)
              The CME pricing-feed age climbs and FRM stale-quote % follows. Nobody
              configured a monitor for this; Watchdog flags the anomaly and
              correlates root → symptom. That detection is what triggers the workflow.
      - type: notebook_cells
        attributes:
          definition:
            type: timeseries
            title: "Trigger — CME feed age (s) leads FRM stale-quote %"
            show_legend: true
            requests:
              - response_format: timeseries
                display_type: line
                queries:
                  - {data_source: metrics, name: feed, query: "avg:agri.dataplatform.pricing_feed_age_sec{environment:production}"}
                  - {data_source: metrics, name: stale, query: "avg:agri.pricing.stale_quote_pct{environment:production}"}
                formulas:
                  - {formula: "feed", alias: "CME feed age (s)"}
                  - {formula: "stale", alias: "FRM stale-quote %"}
      - type: notebook_cells
        attributes:
          definition:
            type: markdown
            text: |
              ## Step 2 — Workflow enriches and auto-opens a ServiceNow incident
              The Datadog Workflow pulls the root-cause signal and blast radius and
              opens an **enriched** incident — root cause, the five affected revenue
              apps, the runbook, and the assignment group — so the analyst opens a
              ticket that already has the answer, not a bare alert.

              ```
              INC1000001  ·  Urgency: 1 - High  ·  Assignment group: data-platform-sre
              Short description: Stale CME pricing feed degrading revenue apps (auto-detected)
              Root cause : CME market-data feed staleness on the GCP Bunge Data Platform
              Signal     : agri.dataplatform.pricing_feed_age_sec  (Watchdog, no threshold)
              Blast radius: Bunge Mobile, myBunge, BungeServices, FRM, BungeAg
              Runbook    : restart Dataflow/Composer pricing-feed job → verify feed age < 20s
              ```
      - type: notebook_cells
        attributes:
          definition:
            type: timeseries
            title: "Open ServiceNow incidents (auto-opened → auto-closed pulse)"
            show_legend: true
            requests:
              - response_format: timeseries
                display_type: area
                queries:
                  - {data_source: metrics, name: open, query: "max:agri.itsm.incidents_open{*}"}
                formulas:
                  - {formula: "open", alias: "open incidents"}
      - type: notebook_cells
        attributes:
          definition:
            type: markdown
            text: |
              ## Step 3 — Noise reduction: one incident, not a storm
              A stale feed would normally light up dozens of downstream alerts across
              five apps. Datadog correlates them into a **single** incident — the
              suppressed-signal count is the noise the analyst never has to triage.
      - type: notebook_cells
        attributes:
          definition:
            type: timeseries
            title: "Raw alerts collapsed into one correlated incident"
            show_legend: true
            requests:
              - response_format: timeseries
                display_type: bars
                queries:
                  - {data_source: metrics, name: sup, query: "max:agri.itsm.alerts_suppressed{*}"}
                formulas:
                  - {formula: "sup", alias: "alerts suppressed"}
      - type: notebook_cells
        attributes:
          definition:
            type: markdown
            text: |
              ## Step 4 — Auto-close on recovery, with MTTR
              When feed age drops back under 20s and FRM stale-quote under 1% and
              stays there, the workflow **auto-resolves** the incident and records
              MTTR. Human-in-the-loop stays on the *remediation* action (the pipeline
              restart); the open/enrich/close bookkeeping is automated.
      - type: notebook_cells
        attributes:
          definition:
            type: timeseries
            title: "Cumulative auto-opened vs auto-closed (the loop balances)"
            show_legend: true
            requests:
              - response_format: timeseries
                display_type: line
                queries:
                  - {data_source: metrics, name: opened, query: "max:agri.itsm.incidents_auto_opened{*}"}
                  - {data_source: metrics, name: closed, query: "max:agri.itsm.incidents_auto_closed{*}"}
                formulas:
                  - {formula: "opened", alias: "auto-opened"}
                  - {formula: "closed", alias: "auto-closed"}
      - type: notebook_cells
        attributes:
          definition:
            type: markdown
            text: |
              ## ROI / Business impact
              **What just happened, in operations terms.** A single stale data-platform
              feed put all five revenue apps at risk of mispricing during trading
              hours. Detection, enrichment, ticketing, and closure were automated; an
              analyst approved one remediation instead of triaging an alert storm.

              | Per incident | Manual (today, 28 tools) | Automated (Datadog) | Delta |
              |---|---|---|---|
              | Detect | minutes–hours (often customer-reported) | seconds (Watchdog, no threshold) | hours → seconds |
              | Triage / correlate | cross-team bridge call across tools | one correlated incident | ~50 signals → 1 |
              | MTTR | ~59 min (Shawn's rule) | ~12 min | **~47 min/incident** |
              | Analyst effort | multi-tool hunt | approve 1 runbook | hours → minutes |

              **Annualized.** At an SRE/analyst loaded cost ~$110/hr, ~47 min saved per
              incident is ~$86 in labor each — but the real number is the **revenue
              protected**: 10,000+ transactions/day priced correctly, the 1–2% pricing
              edge defended during harvest, and the $190M Viterra synergy that depends
              on this visibility.

              **Strategic value beyond labor.** Analysts see only real tickets (less
              burnout, faster onboarding for mixed-seniority regional teams); every
              auto-closed incident is one fewer reason a farmer gets a wrong price;
              and the close-loop is auditable evidence for the Gartner scorecard.

              **Bottom line.** The loop turns a silent, multi-hour, multi-tool incident
              into a minutes-long, single-ticket, auto-documented one — that is the
              MTTR story that reaches the CFO.
      - type: notebook_cells
        attributes:
          definition:
            type: markdown
            text: |
              ## Making it live (post-demo)
              - Bind a **ServiceNow connection** in Workflow Automation; set
                `connection_label: INTEGRATION_SERVICENOW` on the steps in
                `workflows.yaml` and add the verified `servicenow_*` action IDs to
                the toolkit catalog (see `WORKFLOW_ACTIONS.md`).
              - Same pattern for the Slack notify step (`INTEGRATION_SLACK`).
              - Keep the human-in-the-loop approval on the pipeline-restart action;
                start with enrich + auto-open (low risk) before enabling auto-close.

  - name: "[Agribusiness] Datadog vs Dynatrace — Differentiation (Bunge scorecard)"
    type: documentation
    time_range: "1h"
    cells:
      - type: notebook_cells
        attributes:
          definition:
            type: markdown
            text: |
              # Datadog vs Dynatrace — the Bunge differentiation pack

              For Eduardo's Gartner scorecard. **Don't dismiss Davis** — Dynatrace has
              strong causal AI. The wedge for *Bunge specifically* is not "our AI is
              smarter," it's **what the AI can see**: an estate that includes the
              185-site network, logs at scale, DBM, and the GCP data platform — so the
              AI can correlate **data → app → revenue**, which an APM-first platform
              structurally can't. The two live charts below are the proof points to
              pressure-test across both vendors.

              > Ask both vendors to do *this* correlation live: a stale data-platform
              > feed → FRM mispricing → revenue-app errors, plus the 185-site network
              > layer underneath. That single ask is the scorecard.
      - type: notebook_cells
        attributes:
          definition:
            type: markdown
            text: |
              ## Scorecard view (evidence, not bravado)

              | Criterion (Eduardo's words) | Datadog | Dynatrace consideration |
              |---|---|---|
              | **Breadth of data the AI sees** | One dataset: APM, logs, DBM, NDM/network (185 sites/500+ links), RUM, security, **+ the GCP data platform** | Strong APM/infra + Davis; network-device layer and a custom data-platform are not native strengths — pressure-test the correlation |
              | **AIOps (his #1)** | Watchdog (zero-config detect), Bits AI (agentic + natural-language SRE), native ServiceNow enrich/open/close, Forecasts | Davis causal AI is strong; verify the agentic + NL workflow and the native ServiceNow close-loop on the scorecard |
              | **Network / SolarWinds replacement** | NDM device-level + NetFlow + syslog correlated to infra, 185 sites | APM-first; device-level network monitoring is a known gap — a real Bunge requirement |
              | **Ease / agent consolidation** | One Datadog Agent, Watchdog on by default, Ansible-deployable | OneAgent is also single-agent; compare on the data breadth above |
              | **Explainability (leadership cautious on AI)** | Watchdog shows correlated evidence; Bits cites sources; human-in-the-loop on actions | Davis is explainable too; differentiate on breadth + agentic NL, not "more explainable" |

              **The honest line for the room:** "Both are strong AIOps platforms. The
              question for Bunge is whether the AI can see the network layer and the
              data platform that every revenue app depends on — because that's where
              your highest-impact, currently-unwatched risk lives."
      - type: notebook_cells
        attributes:
          definition:
            type: markdown
            text: |
              ## Proof point 1 — one AI, one dataset, data → app → revenue
              A stale CME feed (data platform) drives FRM stale-quote % (pricing) which
              drives revenue-app errors (apps) — all on one dataset, one correlation.
              This cross-domain chain is the wedge: an APM-only AI sees the app errors
              but not the data-platform root cause.
      - type: notebook_cells
        attributes:
          definition:
            type: timeseries
            title: "Cross-domain correlation: feed age (s) → stale-quote % → revenue-app errors"
            show_legend: true
            requests:
              - response_format: timeseries
                display_type: line
                queries:
                  - {data_source: metrics, name: feed, query: "avg:agri.dataplatform.pricing_feed_age_sec{environment:production}"}
                  - {data_source: metrics, name: stale, query: "avg:agri.pricing.stale_quote_pct{environment:production}"}
                  - {data_source: metrics, name: apperr, query: "sum:agri.app.errors_total{service_name:(frm-pricing-platform OR bunge-mobile-bff OR bungeag-web)}.as_count()"}
                formulas:
                  - {formula: "feed", alias: "CME feed age (s) — data"}
                  - {formula: "stale", alias: "FRM stale-quote % — pricing"}
                  - {formula: "apperr", alias: "revenue-app errors — apps"}
      - type: notebook_cells
        attributes:
          definition:
            type: markdown
            text: |
              ## Proof point 2 — the 185-site network layer an APM-first AI can't see
              Harvest connectivity and WAN link latency across the origination network.
              When a silo loses connectivity, grain doesn't move and scale tickets
              don't post — a revenue event. Ask Dynatrace to show this device-level
              network layer correlated with the apps above.
      - type: notebook_cells
        attributes:
          definition:
            type: timeseries
            title: "Origination network — site connectivity % and WAN link latency (ms) by region"
            show_legend: true
            requests:
              - response_format: timeseries
                display_type: line
                queries:
                  - {data_source: metrics, name: conn, query: "avg:agri.site.connectivity_pct{environment:production} by {region}"}
                  - {data_source: metrics, name: lat, query: "avg:agri.network.link_latency_ms{environment:production} by {region}"}
                formulas:
                  - {formula: "conn", alias: "site connectivity %"}
                  - {formula: "lat", alias: "WAN link latency (ms)"}
      - type: notebook_cells
        attributes:
          definition:
            type: markdown
            text: |
              ## How to run the bake-off (next step for the scorecard)
              1. Give both vendors the **same slice**: data platform → FRM → Bunge
                 Mobile, plus one origination region's network.
              2. Trigger the stale-feed scenario; score **time-to-detect**,
                 **correlation depth** (did the AI link data → app → revenue?), and
                 **network visibility** (device-level, or app-only?).
              3. Score the **AIOps loop**: zero-config detection, natural-language
                 investigation, and a native ServiceNow enrich/open/close.
              4. Weight by Bunge's stated priorities: AIOps (#1), network/SolarWinds
                 replacement, ease/consolidation (28 → ~5), explainability.

              *This notebook pairs with the `workflows.yaml` close-loop and the AIOps
              ServiceNow dashboard — together they are the leave-behind differentiation
              pack Eduardo asked for.*
