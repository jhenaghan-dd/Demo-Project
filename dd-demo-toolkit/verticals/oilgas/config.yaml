  # The forecast mart. Freshness and row count move WITH the advisor's answer
  # quality, not ahead of it — the mart is the advisor's input, so there is no
  # lag between them. Resist the urge to stagger these for drama.
  warehouse:
    devices:
    - type: warehouse_node
      manufacturer: Custom
      model: ForecastMart
      firmware: "3.4"
      count: 1
      metrics:
      - name: oilgas.warehouse.rows_loaded_count
        type: gauge
        unit: "1"
        range: [2880, 4800]
        drift: 0
      - name: oilgas.warehouse.table_freshness_min
        type: gauge
        unit: min
        range: [35, 540]
        drift: 0
      - name: oilgas.warehouse.null_row_pct
        type: gauge
        unit: percent
        range: [1, 22]
        drift: 0
      - name: oilgas.warehouse.query_queue_depth_count
        type: gauge
        unit: "1"
        range: [4, 38]
        drift: 0

  # The AI drilling advisor's answer-quality evaluators. Three models, distinct
  # `model:` values so `by {device_model}` splits them.
  #
  # All three regress TOGETHER. That simultaneity is the evidence that rules out
  # the model and the prompt in hop 1 and forces the investigation upstream —
  # a single model regressing would be a model problem, not a data problem.
  #
  # Model names here are generic. A customer's real stack goes in their overlay.
  expert_eval:
    devices:
    - type: expert_eval_node
      manufacturer: Custom
      model: advisor-primary
      firmware: "1.0"
      count: 1
      metrics: &advisor_metrics
      - name: oilgas.expert.answer_confidence_ratio
        type: gauge
        unit: "1"
        range: [0.52, 0.91]
        drift: 0
      - name: oilgas.expert.grounding_score_ratio
        type: gauge
        unit: "1"
        range: [0.48, 0.94]
        drift: 0
      - name: oilgas.expert.stale_input_rate_pct
        type: gauge
        unit: percent
        range: [1, 34]
        drift: 0
      # Counter pair backing the answer-confidence SLO.
      - name: oilgas.expert.answers_total
        type: counter
        unit: "1"
        range: [50, 50]
        drift: 0
      - name: oilgas.expert.low_confidence_answers_total
        type: counter
        unit: "1"
        range: [2, 18]
        drift: 0
    - type: expert_eval_node
      manufacturer: Custom
      model: advisor-secondary
      firmware: "1.0"
      count: 1
      metrics: *advisor_metrics
    - type: expert_eval_node
      manufacturer: Custom
      model: advisor-fallback
      firmware: "1.0"
      count: 1
      metrics: *advisor_metrics

# Trace topology. Every service MUST declare `language:` as a real key and a
# NON-EMPTY `operations:` list — `_generate_service_trace` early-returns on
# `if not service or not service.operations` (engine.py:707-709) before the
# spans, the per-service logs, the auto-created `oilgas.app.*` counters
# (engine.py:789-800) AND the cross-service `peer.service` edge that draws the
# Service Map (engine.py:807-813). A service with no operations deploys a
# Service Catalog entry that renders an empty page, which is worse than nothing
# in front of a customer.
#
# Do NOT use `language: nodejs` — `_DOWNSTREAM_TEMPLATES` (engine.py:244-260)
# supports only java/dotnet/python/go/swift, and nodejs silently yields no child
# spans. Every `dependencies` entry declares an explicit `operation:`; a missing
# one is defensively rewritten to "" (engine.py:198-204), producing a nameless
# span on a service page the investigation asks the SE to open.
services:
- name: expert-api
  host: expert-api-01
  language: python
  framework: FastAPI
  operations:
  - name: "POST /api/advisor/ask"
    latency_base_ms: 1400
    latency_p99_ms: 3800
    error_rate: 0.011
  - name: "GET /api/advisor/citations"
    latency_base_ms: 180
    latency_p99_ms: 620
    error_rate: 0.004
  dependencies:
  - service: warehouse-loader
    operation: "query_forecast_mart"
    probability: 0.85

- name: warehouse-loader
  host: warehouse-loader-01
  language: python
  framework: SQLAlchemy
  operations:
  - name: "query_forecast_mart"
    latency_base_ms: 240
    latency_p99_ms: 900
    error_rate: 0.003
  - name: "load_nightly_batch"
    latency_base_ms: 3100
    latency_p99_ms: 7400
    error_rate: 0.002

- name: pipeline-orchestrator
  host: pipeline-orch-01
  language: python
  framework: Airflow
  operations:
  - name: "run_nightly_forecast_dag"
    latency_base_ms: 2600
    latency_p99_ms: 6800
    error_rate: 0.002
  dependencies:
  - service: thirdparty-signal-api
    operation: "POST /v1/signal-batch"
    probability: 0.8
  - service: warehouse-loader
    operation: "load_nightly_batch"
    probability: 0.9

# error_rate 0.0 on both operations is deliberate and load-bearing. Hop 4 of the
# investigation clears this service, and "error rate flat throughout" has to be
# literally true rather than merely asserted. Absence of signal is the evidence.
- name: thirdparty-signal-api
  host: signal-vendor-edge-01
  language: java
  framework: SpringBoot
  operations:
  - name: "POST /v1/signal-batch"
    latency_base_ms: 310
    latency_p99_ms: 1100
    error_rate: 0.0
  - name: "GET /v1/signal-batch/status"
    latency_base_ms: 90
    latency_p99_ms: 300
    error_rate: 0.0

- name: field-ingest-gateway
  host: field-ingest-01
  language: go
  framework: gRPC
  operations:
  - name: "ingest_wits_frame"
    latency_base_ms: 45
    latency_p99_ms: 210
    error_rate: 0.006
  dependencies:
  - service: pipeline-orchestrator
    operation: "run_nightly_forecast_dag"
    probability: 0.3
