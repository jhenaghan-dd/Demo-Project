# Upstream Oil & Gas — industry-agnostic vertical (art-of-the-possible).
#
# The story this vertical exists to tell is "From Field to Forecast": a network
# outage at a remote well pad opens a gap in field data uploads; the overnight
# 28-step pipeline processes the short input without failing; degraded data lands
# in the forecast mart; and the drilling-advisor chatbot answers the next morning
# from bad inputs. Five hops, walked backwards in about five minutes.
#
# This is the GENERIC base vertical. No customer nouns live here — real site
# names, the customer's orchestrator, and their model stack belong in
# `overlays/<customer>/`. That split is what makes the vertical reusable at the
# next E&P account (CLAUDE.md §6).
#
# Namespace: env_prefix `oilgas`, used literally in every query. Directory name,
# `vertical.name` and `env_prefix` are deliberately the same string — renaming
# later is a repo-wide coordinated edit.
#
# ---------------------------------------------------------------------------
# Metric-design rules this file follows (each traces to a real toolkit bug):
#
#   * Every metric declares an explicit `range`. The engine seeds device state at
#     the range MIDPOINT (simulator/engine.py:66-70) and `MetricConfig.range`
#     defaults to [0, 100], so an undeclared range emits a flat 50 forever and a
#     [0,1] boolean emits a flat 0.5. See `hospital.device.online` for the
#     shipped version of that bug.
#   * `range` is written as [trough, baseline] wherever the plugin drives the
#     metric. The engine clamps INCLUSIVELY (`max(lo, min(hi, v))`,
#     engine.py:662) and plugins run BEFORE the clamp (engine.py:621 vs :629),
#     so with `drift: 0` a plugin write lands on either endpoint exactly. The
#     plugin therefore reads its own baseline and trough off the config and the
#     two cannot drift apart.
#   * Anything that must be an exact integer or a boolean carries `drift: 0`.
#     Row counts with drift produce fractional rows — the spurious-precision bug.
#   * NO `environment_scale`. The engine multiplies every emitted value by it
#     (engine.py:667-670); finance's `production: 3.0` is why EY's F1 gauge sits
#     at 2.55 and its quality monitors can never fire.
#   * NO percentile aggregators consume any metric here (STYLE_GUIDE §1.1).
# ---------------------------------------------------------------------------

vertical:
  name: oilgas
  display_name: Upstream Oil & Gas
  description: >-
    Upstream exploration & production — remote well-pad telemetry over
    intermittent backhaul, a multi-step overnight batch pipeline that moves
    drilling data through internal systems and a third-party signal vendor into
    a forecast mart, and the AI drilling advisor that answers from it. Field
    connectivity, pipeline integrity, warehouse freshness and answer quality in
    one control plane.
  env_prefix: oilgas
  emit_interval_sec: 15

# One dimension, seven values, deliberately.
#
# The engine places devices by per-dimension round-robin WITHIN a single device
# entry: `location = {name: values[i % len(values)]}` for i in range(count)
# (engine.py:441-447). A `count: 1` device therefore always lands on values[0] of
# every dimension. With 28 singleton pipeline steps plus the warehouse, handoff
# and advisor nodes, a naive multi-dimension layout silently pins all of them to
# the same pad — including the pad the outage targets, which would make every
# pad-scoped filter and monitor sweep in the whole fleet.
#
# So values[0] is `central-ops`, which is truthful for every singleton: the
# pipeline, the mart and the advisor really do run centrally. Only
# `field_gateway` has a real count (7), so it alone spreads across the pads.
# Basin is readable inside each site name, so there is no second dimension to
# fall out of sync.
locations:
  dimensions:
  - name: site
    values:
    - central-ops
    - permian-pad-a
    - permian-pad-b
    - eagle-ford-pad-c
    - eagle-ford-pad-d
    - haynesville-pad-e
    - haynesville-pad-f

device_categories:

  # Well-pad edge gateways — the root cause lives here. One entry with count 7
  # so the round-robin puts one gateway on each site (six pads + central-ops).
  #
  # Note there is no NDM/SNMP telemetry path in this toolkit. These are the
  # signals an edge gateway reports about itself, NOT Network Device Monitoring.
  # Say that out loud rather than implying NDM.
  field_edge:
    devices:
    - type: field_gateway
      manufacturer: Custom
      model: FieldEdgeGateway
      firmware: "4.2"
      count: 7
      metrics:
      # The gateway is up; the CELLULAR BACKHAUL is what drops. The gateway
      # reports its own uplink state over the surviving path, which is why
      # Datadog still receives metrics during the outage — and why the outage is
      # an alertable threshold breach rather than a no-data hole. Bits AI SRE
      # only auto-launches on a transition to ALERT, so a literal telemetry gap
      # would prevent the investigation from ever starting.
      - name: oilgas.field.link_up_state
        type: gauge
        unit: "1"
        range: [0, 1]
        drift: 0
      - name: oilgas.field.records_received_per_min
        type: gauge
        unit: "1"
        range: [0, 780]
        drift: 0
      - name: oilgas.field.backhaul_latency_ms
        type: gauge
        unit: ms
        range: [25, 400]
        drift: 4
      # The second, damning finding: failover never engages. The plugin holds
      # this at 0 on every gateway in every phase — the story is the absence of
      # a rise, not a spike.
      - name: oilgas.field.failover_engaged_state
        type: gauge
        unit: "1"
        range: [0, 1]
        drift: 0
      # Counter pair backing the uplink-availability SLO. A count-based SLO over
      # a gauge deploys with a 200 and then shows no data, so these are real
      # counters. link_ticks_total is a degenerate [1,1] range: always exactly 1
      # per tick, no plugin involvement. link_down_ticks_total MUST span [0,1] —
      # a [0,0] range would let the inclusive clamp pin it at zero and the
      # plugin could never lift it during the outage.
      - name: oilgas.field.link_ticks_total
        type: counter
        unit: "1"
        range: [1, 1]
        drift: 0
      - name: oilgas.field.link_down_ticks_total
        type: counter
        unit: "1"
        range: [0, 1]
        drift: 0

  # The third-party signal vendor handoff — steps 12 (outbound) and 15 (return).
  # Both sides move together and proportionally: the vendor processed correctly
  # what it was given. This is the hop the investigation CLEARS, so nothing here
  # ever errors.
  handoff:
    devices:
    - type: handoff_node
      manufacturer: Custom
      model: VendorSignalHandoff
      firmware: "2.1"
      count: 1
      metrics:
      - name: oilgas.handoff.records_out_count
        type: gauge
        unit: "1"
        range: [3472, 4960]
        drift: 0
      - name: oilgas.handoff.records_in_count
        type: gauge
        unit: "1"
        range: [2964, 4940]
        drift: 0

  # >>> BEGIN GENERATED — scripts/gen_oilgas_pipeline.py — DO NOT EDIT BY HAND
